[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-realignment"
version = "0.1.0"
description = "Strong-teacher Harness Realignment Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "harbor>=0.22,<0.23",
    "httpx>=0.28,<1",
    "langchain-core>=1.5.4,<2",
    "langchain-openai>=1.4.3,<2",
    "tqdm>=4.67,<5",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-bash==0.25.1",
    "mini-swe-agent==2.4.6",
    "jsonschema>=4,<5",
]

[project.scripts]
hrp = "src.__main__:main"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = false

[tool.setuptools.package-data]
"src.adapter" = ["*.md", "*.mjs"]
"src.benchmark" = ["*.mjs", "config/*.json", "config/*.sources"]

[tool.uv.sources]
deepagents = { path = "agents/deepagents/libs/deepagents", editable = true }
mini-swe-agent = { path = "agents/mini-swe-agent", editable = true }
